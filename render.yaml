services:
  - type: web
    name: sentrix-backend
    runtime: python3
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SENTRIX_CORS_ORIGINS
        value: "https://t20-the-quarks.vercel.app,http://localhost:5173,http://localhost:5174,http://localhost:5175"
    # WebSocket support is automatic on Render for standard web services
    # No additional config needed for /ws endpoint